@if (!isloading){
<div class="custom-dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <h4 mat-dialog-title>{{operacion}}</h4>  
    <!--form [formGroup]="formCli" class="row ml-3 mt-3 mr-10"-->     
     <form [formGroup]="formfp" class="p-3">        
      <div class="row g-3 mb-3">
        <div class="col-4">           
           <mat-form-field class="w-100" appearance="fill">
                 <mat-label>Nro F.de Pago</mat-label>
                 <input matInput [readonly]="true" formControlName="idfpago" style="text-align: center;">	
            </mat-form-field>    
        </div>

        <div class="col-4 ms-auto">
           <mat-form-field class="w-100" appearance="fill">
                <mat-label>Nro. Gasto</mat-label>
                <input matInput formControlName="idgasto" style="text-align: center;">	
            </mat-form-field>    
        </div>   
      </div>   
      <div class="row g-3 mb-3">
        <div class="col-10">
          <mat-form-field appearance="outline">
           <mat-label>Forma de Pago</mat-label>
             <textarea
               matInput
               rows="4"
               maxlength="2000"
               formControlName="descrip">
            </textarea>

            <!--mat-hint >
              {{ formfp.controls['descrip']?.value || 0 }}
            </mat-hint-->
          </mat-form-field>
        </div>
      </div>

      <div class="botonera">            
              <button class="btn btn-sm btn-outline-primary me-5" 
                       [disabled]="formfp.invalid || data.accion!=='A'" 
                       (click)="AgregarFP()">Agregar
              </button>                                              
               <button class="btn btn-sm btn-outline-success me-5" 
                       [disabled]="formfp.invalid || data.accion!=='M'" 
                       (click)="ModificarFP()">Modificar
              </button>
          
              <button class="btn btn-sm btn-outline-secondary"                
                       (click)="Anular()">Cancelar
              </button>                       
        </div>       
     </form>
    </div>       
  }
