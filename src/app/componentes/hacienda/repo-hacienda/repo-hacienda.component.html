@if (!isloading){
   <div class="movimcta-container">
    <form  [formGroup]="formHac" class="row mt-1">        
        <div class="col-auto">
         <div class="header">
           <h4>INFORME DE HACIENDA</h4>
         </div>        
        </div>  
       
        <div class="col-auto">        
            <mat-form-field class="w-100" appearance="fill" > 
              <input matInput [matDatepicker]="picker" 
                  placeholder = "fecha inicial"                      
                  (dateChange)="ondFechaChange($event)"                 
                  formControlName="dfecha">
            <mat-datepicker-toggle  matSuffix [for]="picker" > </mat-datepicker-toggle> 
            <mat-datepicker #picker> </mat-datepicker>  
            <!--mat-hint>{{ formInfoMov.controls['dfecha'].value | date : "dd/MM/yyyy HH:mm:ss"}}</mat-hint--> 
          </mat-form-field >
        </div>
        <div class="col-auto">
          <mat-form-field class="w-100" appearance="fill" > 
            <input #fechalab matInput #inputFocus [matDatepicker]="pickerh"  
                  placeholder = "fecha final" 
                  (dateChange)="onhFechaChange($event)"
                  formControlName="hfecha" > 
            <mat-datepicker-toggle  matSuffix [for]="pickerh" > </mat-datepicker-toggle> 
            <mat-datepicker #pickerh> </mat-datepicker>  
            <!--mat-hint>{{ formInfoLab.controls['hfecha'].value | date : "dd/MM/yyyy HH:mm"}}</mat-hint--> 
          </mat-form-field >      
        </div>       
        <div class="col-auto">
           <button 
             mat-icon-button
             [disabled]="!mmatriz"
             class="action-btn"            
             title="imprimir informe"
             (click)="generarPDF()">
             <i class="bi bi-printer"></i>               
        </button>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary btn-sm add-button" (click)="leerMovimientosDeHacienda()">
            <i class="bi bi-plus-circle me-1"></i>Informe Resumido
          </button>
        </div> 

        <div class="col-auto">
        <mat-form-field class="w-100" appearance="fill">
          <mat-label>Elija un tipo de informe</mat-label>
          <mat-select  (selectionChange)="onSelectionTipoInf($event)">                         
                 @for (tipoi of this.totalesPor; let i=$index; track tipoi){
                <mat-option [value]="i">                 
                  {{ tipoi }}                 
                </mat-option>
                }
          </mat-select>
        </mat-form-field>
      </div> 
       <div class="col">
        <button class="btn btn-primary btn-sm add-button" 
                      [disabled]="tipoinf===undefined"
                      (click)="desplegarInforme()">
            Desplegar 
        </button>
      </div>    
        <div class="col-auto ms-auto">
          <button class="btn btn-secondary btn-sm add-button ms-auto" (click)="volver()">
             <i class="bi bi-arrow-left me-1"></i>Volver
         </button>
         </div>
     </form>       
     @if (mmatriz){
      <!--div class="table-container" style="overflow-x: auto"--> 
      <!--div style="overflow-x: auto"--> 
      <div class="d-flex justify-content-center">
        <table 
          mat-table 
          [dataSource]="datos"           
          class="mat-elevation-z8 tabla-matriz">

          <!-- Columna de encabezado de fila -->
          <ng-container matColumnDef="hacienda">
             <th mat-header-cell *matHeaderCellDef></th>
             <td mat-cell *matCellDef="let row; let i = index">
                {{ hacienda[i] }}
             </td>
          </ng-container>

          <!-- Columnas de datos dinámicas -->
          @for (col of campos; track col; let colIndex=$index ){
            <ng-container [matColumnDef]="col">
              <th mat-header-cell *matHeaderCellDef class="centrado"> {{ col }}  </th>
              <td mat-cell *matCellDef="let row; let rowIndex = index" style="text-align: center;"
                 [ngClass]="{'fila-totales':  campos[colIndex].charAt(0)=='*'}">
                 {{ datos[rowIndex][colIndex] }}          
              </td>
            </ng-container>
         }
      <tr mat-header-row *matHeaderRowDef="Columnas"></tr>
      <tr mat-row *matRowDef="let row; let index = index; columns: Columnas;"
          [ngClass]="{'fila-totales':  hacienda[index].charAt(0)=='*'}">
      </tr>
     </table>
    </div>
    }
</div>
}
