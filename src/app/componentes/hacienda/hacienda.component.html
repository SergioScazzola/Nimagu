<div class="hacienda-container">
   <div class="row">
      <div class="col-auto">
        <div class="header">
          <h4>Mov.HACIENDA</h4>
        </div>
      </div>      
      <div class="col">
       <input #filtroInput (keyup)="aplicarFiltro(filtroInput.value)" placeholder="Filtrar por campo">
      </div>          
      
     

      <div class="col">
        <button class="btn btn-secondary btn-sm" (click)="informeMovHacienda()">
          <i class="bi bi-plus-circle me-1"></i>Informes
        </button>
      </div>
       
      <div class="col">
        <button class="btn btn-warning btn-sm" (click)="agMovimientoH()">
          <i class="bi bi-plus-circle me-1"></i>Stock Hacienda
        </button>
      </div>
      <div class="col-1">        
      </div>
      <div class="col">
        <button class="btn btn-success btn-sm" (click)="agTipoHacienda()">
          <i class="bi bi-plus-circle me-1"></i>Tipo Hacienda
        </button>
      </div>
      <div class="col">
        <button class="btn btn-info btn-sm" (click)="agCampo()">
          <i class="bi bi-plus-circle me-1"></i>Campo
        </button>
      </div>
       <div class="col-2 text-end">
        <button class="btn btn-sm btn-secondary" (click)="volver()">
          <i class="bi bi-box-arrow-right me-1"></i>
          Menu Ppal
        </button>
    </div>    
    
  </div>  
  <div class="table-container" style="overflow-x: auto">
    <table
      mat-table
      class="mat-elevation-z8"
      [dataSource]="this.dataSource"
      style="width: 100%"
    >
      <!-- Columna id Movh -->
      <ng-container matColumnDef="idmovh">
        <th mat-header-cell *matHeaderCellDef class="centrado">Nro</th>
        <td mat-cell *matCellDef="let renMov">{{ renMov.idmovh }}</td>
      </ng-container>

      <!-- Columna Fecha -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef class="centrado">Fecha</th>
        <td mat-cell *matCellDef="let renMov">{{  renMov.fecha | date : "dd/MM/yyyy"}}</td>
      </ng-container>

      <!-- Columna cantidad -->
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef class="centrado">Cantidad</th>
        <td mat-cell *matCellDef="let renMov">{{ renMov.cantidad }}</td>
      </ng-container>

      
      <!-- Columna nhacienda -->
      <ng-container matColumnDef="nhacienda">
        <th mat-header-cell *matHeaderCellDef>Tipo de Hacienda</th>
        <td mat-cell *matCellDef="let renMov">{{ renMov.nhacienda }}</td>
      </ng-container>
    
     
      <!-- Columna Campo -->
      <ng-container matColumnDef="ncampo">
        <th mat-header-cell *matHeaderCellDef>Campo</th>
        <td mat-cell *matCellDef="let renMov">{{ renMov.ncampo }}</td>
      </ng-container>
           
       <!-- Columna observ -->
       <ng-container matColumnDef="observ">
        <th mat-header-cell *matHeaderCellDef class="centrado">Observaciones</th>
        <td mat-cell *matCellDef="let renCV">{{ renCV.observ }}</td>
      </ng-container>

      <ng-container matColumnDef="M">
        <th mat-header-cell *matHeaderCellDef>M</th>
        <td mat-cell *matCellDef="let renMov">
          <div class="text-center">
            <button
              mat-icon-button
              class="action-btn"
              title="modificar mov.hacienda"
              (click)="UpdateMovimientoH(renMov.idmovh)"
            >
              <i class="bi bi-pencil-fill"></i>
            </button>
          </div>
        </td>
      </ng-container>
     <ng-container matColumnDef="B">
        <th mat-header-cell *matHeaderCellDef>B</th>
        <td mat-cell *matCellDef="let renMov">
          <div class="text-center">
            <button
              mat-icon-button
              class="action-btn"
              title="eliminar mov.hacienda"
              (click)="eliminarMovH(renMov.idmovh)"
            >
              <i class="bi bi-trash-fill"></i>
            </button>
          </div>
        </td>
      </ng-container>
      <!-- Definición de filas -->
      <tr mat-header-row *matHeaderRowDef="colMovHac; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; let index; columns: colMovHac"></tr>
    </table>
  </div>
</div>
